// ============================================================================
// CrossTalk 配置模板
// 首次启动时 SourceMod 会自动生成 cfg/sourcemod/crosstalk.cfg（含全部 ConVar 注释）
// 本文件仅供参考，服务器实际生效的配置为运行时生成的 crosstalk.cfg
// ============================================================================

// 总开关：是否启用跨服聊天功能（0=完全禁用，含接收与渲染）
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
cross_talk_enabled "1"

// 共享 SQLite 数据库（留空 = 默认 addons/sourcemod/data/crosstalk/shared.sq3，
// 所有服务器共享同一 data/ 目录时零配置互通。或填相对路径如 data/crosstalk/shared.sq3；
// 或绝对路径 file:/绝对路径/xxx.sq3（目录由插件自建）。所有服务器必须指向同一个文件才能互通）
// -
// Default: ""
cross_talk_db_path ""

// 服务器标识（用于消息来源与去重）。留空则自动使用 hostname 值。
// -
// Default: ""
cross_talk_server_id ""

// 跨服消息轮询间隔（秒）。值越小延迟越低，数据库负载越高。
// -
// Default: "0.5"
// Minimum: "0.100000"
// Maximum: "10.000000"
cross_talk_poll_interval "0.5"

// 管理员喊话所需权限位（字母）。b=AdmFlag_Ban, c=Kick, d=Admin, g=Generic, l=Chat, o=Convar, z=Root。
// -
// Default: "b"
cross_talk_announce_flag "b"

// 跨服聊天显示颜色（CS:GO 原生色码名，如 {default} {red} {lightred} {darkred} {green} {lime} {lightgreen} {orange} {yellow} {purple} {blue} {darkblue} {grey} {gold} {orchid} {teamcolor}。注意：CS:GO 不支持十六进制色码）
// -
// Default: "{default}"
cross_talk_chat_color "{default}"

// 跨服喊话在聊天框中显示的颜色（如上）。
// -
// Default: "{red}"
cross_talk_announce_color "{red}"

// HUD 弹屏水平位置（-1.0=居中，0=最左，1=最右）
// -
// Default: "-1.0"
// Minimum: "-1.000000"
// Maximum: "1.000000"
cross_talk_hud_x "-1.0"

// HUD 弹屏垂直位置（-1.0=居中，0=顶部，1=底部）
// -
// Default: "0.1"
// Minimum: "-1.000000"
// Maximum: "1.000000"
cross_talk_hud_y "0.1"

// HUD 弹屏显示时长（秒）
// -
// Default: "5.0"
// Minimum: "0.000000"
// Maximum: "30.000000"
cross_talk_hud_holdtime "5.0"

// HUD 弹屏颜色 红色分量（0-255）
// -
// Default: "255"
// Minimum: "0.000000"
// Maximum: "255.000000"
cross_talk_hud_r "255"

// HUD 弹屏颜色 绿色分量（0-255）
// -
// Default: "80"
// Minimum: "0.000000"
// Maximum: "255.000000"
cross_talk_hud_g "80"

// HUD 弹屏颜色 蓝色分量（0-255）
// -
// Default: "80"
// Minimum: "0.000000"
// Maximum: "255.000000"
cross_talk_hud_b "80"

// HUD 弹屏透明度（0-255，255=不透明）
// -
// Default: "255"
// Minimum: "0.000000"
// Maximum: "255.000000"
cross_talk_hud_alpha "255"

// HUD 弹屏效果（0=淡入，1=闪烁，2=淡出）
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "2.000000"
cross_talk_hud_effect "1"

// HUD 弹屏淡入时长（秒）
// -
// Default: "0.5"
// Minimum: "0.000000"
// Maximum: "10.000000"
cross_talk_hud_fadein "0.5"

// HUD 弹屏淡出时长（秒）
// -
// Default: "0.5"
// Minimum: "0.000000"
// Maximum: "10.000000"
cross_talk_hud_fadeout "0.5"

// 消息保留天数（超期自动清理）
// -
// Default: "7"
// Minimum: "1.000000"
// Maximum: "90.000000"
cross_talk_message_ttl_days "7"

// 消息清理检查间隔（秒）
// -
// Default: "300"
// Minimum: "30.000000"
// Maximum: "3600.000000"
cross_talk_cleanup_interval "300"

// 调试日志（1=详细）
// -
// Default: "0"
// Minimum: "0.000000"
// Maximum: "1.000000"
cross_talk_debug "0"
