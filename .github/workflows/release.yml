name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          VER=$(grep -E '#define CROSSTALK_VERSION' addons/sourcemod/scripting/include/crosstalk/version.inc | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          if [ -z "$VER" ]; then
            echo "Failed to parse CROSSTALK_VERSION from version.inc"
            cat addons/sourcemod/scripting/include/crosstalk/version.inc
            exit 1
          fi
          TAG="v${VER}"
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VER} tag: ${TAG}"
          # 幂等：tag 已存在时区分两种情况
          #   - release 已存在（重复 run）→ 警告并跳过，不重复发布
          #   - release 不存在（漏 bump 版本）→ 报错，要求先自增版本号
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            HTTP_CODE=$(curl -s -o /tmp/release_check.json -w "%{http_code}" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "::warning::Tag $TAG already exists and its GitHub Release was already published (idempotent re-run). Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Tag $TAG already exists but no GitHub Release found. Bump CROSSTALK_VERSION in version.inc on develop before merging."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup SourceMod
        if: steps.version.outputs.skip != 'true'
        run: ./build.sh setup

      - name: Strict compile
        if: steps.version.outputs.skip != 'true'
        run: STRICT=1 ./build.sh
        env:
          STRICT: "1"

      - name: Package Release
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          ZIP="crosstalk-v${VER}.zip"
          PKG="release-package"
          rm -rf "$PKG" "$ZIP"
          mkdir -p "$PKG/addons/sourcemod/plugins"
          mkdir -p "$PKG/addons/sourcemod/translations"
          mkdir -p "$PKG/cfg/sourcemod"
          cp addons/sourcemod/plugins/crosstalk.smx "$PKG/addons/sourcemod/plugins/"
          cp addons/sourcemod/translations/crosstalk.phrases.txt "$PKG/addons/sourcemod/translations/"
          cp cfg/sourcemod/crosstalk.cfg "$PKG/cfg/sourcemod/"
          cp README.md "$PKG/"
          (cd "$PKG" && zip -r "../$ZIP" .)
          ls -lh "$ZIP"
          unzip -l "$ZIP"
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ env.ZIP }}
          fail_on_unmatched_files: true

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.version.outputs.skip }}" = "true" ]; then
            echo "### Release ${{ steps.version.outputs.tag }} already published, skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Release ${{ steps.version.outputs.tag }} published" >> $GITHUB_STEP_SUMMARY
            echo "Artifact: ${{ env.ZIP }}" >> $GITHUB_STEP_SUMMARY
          fi
