name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          VER=$(grep -E '#define CROSSTALK_VERSION' addons/sourcemod/scripting/include/crosstalk/version.inc | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          if [ -z "$VER" ]; then
            echo "Failed to parse CROSSTALK_VERSION from version.inc"
            cat addons/sourcemod/scripting/include/crosstalk/version.inc
            exit 1
          fi
          TAG="v${VER}"
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VER} tag: ${TAG}"
          # Fail if tag already exists (require bump in develop before merge)
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump CROSSTALK_VERSION in version.inc on develop before merging."
            exit 1
          fi

      - name: Setup SourceMod
        run: ./build.sh setup

      - name: Strict compile
        run: STRICT=1 ./build.sh
        env:
          STRICT: "1"

      - name: Package Release
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          ZIP="crosstalk-v${VER}.zip"
          PKG="release-package"
          rm -rf "$PKG" "$ZIP"
          mkdir -p "$PKG/addons/sourcemod/plugins"
          mkdir -p "$PKG/addons/sourcemod/translations"
          mkdir -p "$PKG/cfg/sourcemod"
          cp addons/sourcemod/plugins/crosstalk.smx "$PKG/addons/sourcemod/plugins/"
          cp addons/sourcemod/translations/crosstalk.phrases.txt "$PKG/addons/sourcemod/translations/"
          cp cfg/sourcemod/crosstalk.cfg "$PKG/cfg/sourcemod/"
          cp README.md "$PKG/"
          (cd "$PKG" && zip -r "../$ZIP" .)
          ls -lh "$ZIP"
          unzip -l "$ZIP"
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ env.ZIP }}
          fail_on_unmatched_files: true

      - name: Summary
        run: |
          echo "### Release ${{ steps.version.outputs.tag }} published" >> $GITHUB_STEP_SUMMARY
          echo "Artifact: ${{ env.ZIP }}" >> $GITHUB_STEP_SUMMARY
