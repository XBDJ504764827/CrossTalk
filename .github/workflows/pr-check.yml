name: PR Check

env:
  SM_VERSION: "1.11"

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VER="$(grep -E '#define CROSSTALK_VERSION "' addons/sourcemod/scripting/include/crosstalk/version.inc | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$VER" ]; then echo "Failed to parse CROSSTALK_VERSION"; cat addons/sourcemod/scripting/include/crosstalk/version.inc; exit 1; fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          SHORT="$(echo "$GITHUB_SHA" | cut -c1-7)"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          PRNUM="${{ github.event.number }}"
          if [ -z "$PRNUM" ]; then PRNUM="${{ github.run_number }}"; fi
          echo "prnum=$PRNUM" >> "$GITHUB_OUTPUT"
          echo "Version: $VER, PR: $PRNUM, Short: $SHORT"

      - name: Setup SourceMod 1.11
        shell: bash
        run: |
          set -euo pipefail
          url="$(curl -s https://sm.alliedmods.net/smdrop/${SM_VERSION}/ | grep -o 'sourcemod-1.11[^"]*-linux.tar.gz' | sort -V | tail -n1)"
          echo "SM package: $url"
          curl -sL -o /tmp/sm.tar.gz "https://sm.alliedmods.net/smdrop/${SM_VERSION}/${url}"
          mkdir -p /tmp/sm
          tar xzf /tmp/sm.tar.gz -C /tmp/sm
          chmod +x /tmp/sm/addons/sourcemod/scripting/spcomp* || true
          ls -lh /tmp/sm/addons/sourcemod/scripting/spcomp* 2>&1 | head -n 20
          /tmp/sm/addons/sourcemod/scripting/spcomp64 -h 2>&1 | head -n 20 || true

      - name: Build (strict, -E warnings-as-errors)
        shell: bash
        run: |
          set -euo pipefail
          STRICT=1 SM_DIR=/tmp/sm ./build.sh

      - name: Verify single SMX
        shell: bash
        run: |
          set -euo pipefail
          ls -lh addons/sourcemod/plugins/crosstalk.smx
          count="$(ls addons/sourcemod/plugins/*.smx 2>/dev/null | wc -l)"
          if [ "$count" != "1" ]; then
            echo "Expected exactly 1 smx, got $count"
            ls -la addons/sourcemod/plugins/
            exit 1
          fi

      - name: Package full install zip (PR test package)
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.ver }}"
          SHORT="${{ steps.ver.outputs.short }}"
          PRNUM="${{ steps.ver.outputs.prnum }}"
          PKG="package"
          rm -rf "$PKG" dist
          mkdir -p "$PKG/addons/sourcemod/plugins"
          mkdir -p "$PKG/addons/sourcemod/translations"
          mkdir -p "$PKG/cfg/sourcemod"
          mkdir -p dist
          cp addons/sourcemod/plugins/crosstalk.smx "$PKG/addons/sourcemod/plugins/"
          cp addons/sourcemod/translations/crosstalk.phrases.txt "$PKG/addons/sourcemod/translations/"
          cp cfg/sourcemod/crosstalk.cfg "$PKG/cfg/sourcemod/"
          cp README.md "$PKG/" 2>/dev/null || true
          ZIP="crosstalk-TEST-PR${PRNUM}-v${VER}-${SHORT}.zip"
          echo "Zip: $ZIP"
          (cd "$PKG" && zip -r "../dist/$ZIP" .)
          ls -lh dist/
          unzip -l "dist/$ZIP"

      - name: Upload PR artifact (smx)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crosstalk-TEST-PR${{ steps.ver.outputs.prnum }}-v${{ steps.ver.outputs.ver }}-${{ steps.ver.outputs.short }}
          path: |
            addons/sourcemod/plugins/crosstalk.smx
            addons/sourcemod/translations/crosstalk.phrases.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Upload PR artifact (full zip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crosstalk-TEST-full-PR${{ steps.ver.outputs.prnum }}-v${{ steps.ver.outputs.ver }}-${{ steps.ver.outputs.short }}
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: warn
